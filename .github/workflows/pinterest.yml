name: Pinterest Friday Automation

on:
  schedule:
    # 1. Send Notification at 9:45 PM Bangladesh Time (3:45 PM UTC) on Fridays
    - cron: '45 15 * * 5'
    # 2. Run Main Script at 10:00 PM Bangladesh Time (4:00 PM UTC) on Fridays
    - cron: '0 16 * * 5'
  workflow_dispatch: # Allows manual testing

jobs:
  notify-and-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install google-genai requests Pillow
          
      - name: Send Reminder Notification (9:45 PM BST)
        if: github.event.schedule == '45 15 * * 5'
        run: |
          curl -d "🚨 TIME TO UPDATE TRENDS! 🚨\nPaste your new Pinterest trends into trends.json now! The bot runs in 15 minutes." ntfy.sh/touhidul_pinterest_bot
          
      - name: Run Automation Script (10:00 PM BST)
        if: github.event.schedule == '0 16 * * 5' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          IMG_BB_KEY: ${{ secrets.IMG_BB_KEY }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        run: python main.py
        
      - name: Commit Database Changes
        if: github.event.schedule == '0 16 * * 5' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add trends.json
          git commit -m "Auto-update trend status for the week" || echo "No changes to commit"
          git push
